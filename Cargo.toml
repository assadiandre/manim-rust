[workspace]
resolver = "2"
members = [
    "crates/manim-core",
    "crates/manim-anim",
    "crates/manim-render",
    "crates/manim-typst",
    "crates/manim-scenes",
    "crates/manim-cli",
    "crates/manim-py",
]
# manim-py is built via maturin, not plain cargo (needs a Python interpreter config).
default-members = [
    "crates/manim-core",
    "crates/manim-anim",
    "crates/manim-render",
    "crates/manim-typst",
    "crates/manim-scenes",
    "crates/manim-cli",
]

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package."*"]
opt-level = 2

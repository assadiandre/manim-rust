[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "manim-rust"
version = "0.1.0"
requires-python = ">=3.9"
description = "GPU-native 2D ManimCE remake (Rust engine, Python authoring)"

[tool.maturin]
python-source = "python"
module-name = "manim_rust._native"

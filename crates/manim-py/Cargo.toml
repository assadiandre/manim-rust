[package]
name = "manim-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "_native"
crate-type = ["cdylib"]

[package.metadata.maturin]
name = "manim_rust._native"
python-source = "python"

[dependencies]
manim-anim = { version = "0.1.0", path = "../manim-anim" }
manim-core = { version = "0.1.0", path = "../manim-core" }
manim-render = { version = "0.1.0", path = "../manim-render" }
manim-typst = { version = "0.1.0", path = "../manim-typst" }
pyo3 = { version = "0.29.2", features = ["abi3-py39"] }
